[project]
name = "proqu"
version = "1.0.0"
description = "A shared compute queue for coding agents"
readme = "README.md"
authors = [
    { name = "spuddydev", email = "hlisle@protonmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
proqu = "proqu:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run pytest
      - name: check the tag matches the version
        run: test "$(python3 bin/proqu --version)" = "proqu ${GITHUB_REF_NAME#v}"
      # the installer downloads this archive, it holds only what proqu needs to run
      - run: git archive --format=tar.gz --prefix=proqu/ -o proqu.tar.gz "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" proqu.tar.gz install.sh --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
